name: Actualizar precios

on:
  # GitHub retrasa o salta los horarios programados. Por eso el robot se relanza solo
  # (ver el paso "Siguiente revision"); estos horarios solo lo arrancan cada manana
  # y lo reviven si la cadena se cae. Hora Colombia = UTC - 5.
  schedule:
    - cron: "13 11 * * 1-5"           # 6:13 a. m.
    - cron: "43 11 * * 1-5"           # 6:43 a. m.
    - cron: "23 13-23/2 * * 1-5"      # respaldo cada 2 horas de 8:23 a. m. a 6:23 p. m.
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: actualizar-precios
  cancel-in-progress: false

jobs:
  precios:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pruebas de los lectores de precios
        run: python -m unittest discover -s tests -v

      - name: Cafe Colombia (PDF de la Federacion)
        id: cafe_colombia
        continue-on-error: true
        run: python scripts/cafe_colombia.py

      - name: Cacao y cafe Peru (Bolsa de Nueva York)
        id: bolsa
        continue-on-error: true
        run: python scripts/bolsa.py

      - name: Heno USA (USDA Market News)
        id: heno_usa
        continue-on-error: true
        run: |
          # Los reportes de heno son semanales: se revisan 5 veces al dia (7, 10, 13, 16 y 19 h Colombia)
          H=$(TZ=America/Bogota date +%-H); M=$(TZ=America/Bogota date +%-M)
          TOCA=no
          [ -f data/usa/hay/index.json ] || TOCA=si
          case " 7 10 13 16 19 " in *" $H "*) [ "$M" -lt 19 ] && TOCA=si ;; esac
          if [ "$TOCA" = si ]; then python scripts/heno_usa.py; else echo "Heno USA: no toca en esta vuelta"; fi

      - name: Guardar cambios
        run: |
          git config user.name "precio-agro-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          # Solo se guarda si cambio un precio, una fecha o una tasa; la hora de revision sola no cuenta
          if git diff --cached -U0 -- data/ | grep -E '^[+-]' | grep -vE '^(\+\+\+|---)' | grep -v '"actualizado"' > /dev/null; then
            git commit -m "Precios $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase
            git push
          else
            echo "Sin precios nuevos"
            git reset -q
            git checkout -- data/
          fi

      - name: Siguiente revision (el robot se relanza solo)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # De lunes a viernes, de 6 a. m. a 9 p. m. (hora Colombia): revisa cada 18 minutos.
          # El resto del tiempo espera hasta las 6 a. m. del siguiente dia habil, en tramos de maximo 5 h 20 min.
          SEG=$(python3 -c "
          from datetime import datetime, timedelta, timezone
          co = timezone(timedelta(hours=-5)); ahora = datetime.now(co)
          if ahora.weekday() < 5 and 6 <= ahora.hour < 21:
              print(1080)
          else:
              t = ahora.replace(hour=6, minute=0, second=0, microsecond=0)
              if t <= ahora: t += timedelta(days=1)
              while t.weekday() >= 5: t += timedelta(days=1)
              print(max(60, min(19200, int((t - ahora).total_seconds()))))
          ")
          echo "Siguiente revision en $SEG segundos"
          sleep "$SEG"
          gh workflow run actualizar-precios.yml --ref main -R "$GITHUB_REPOSITORY"
          echo "Siguiente revision lanzada"

      - name: Avisar si alguna fuente fallo
        if: steps.cafe_colombia.outcome == 'failure' || steps.bolsa.outcome == 'failure' || steps.heno_usa.outcome == 'failure'
        run: |
          echo "Cafe Colombia: ${{ steps.cafe_colombia.outcome }} | Bolsa: ${{ steps.bolsa.outcome }} | Heno USA: ${{ steps.heno_usa.outcome }}"
          if [ "${{ steps.heno_usa.outcome }}" = "failure" ]; then echo "::warning::Heno USA fallo; se reintenta en la siguiente ventana"; fi
          if [ "${{ steps.bolsa.outcome }}" = "failure" ]; then exit 1; fi
          if [ "${{ steps.cafe_colombia.outcome }}" = "failure" ]; then
            # La Federacion corta conexiones a veces: solo se marca error en las revisiones de la noche (8 p. m. en adelante)
            if [ "$(TZ=America/Bogota date +%H)" -ge 20 ]; then exit 1; fi
            echo "::warning::La Federacion no respondio; se reintenta en el siguiente horario"
          fi
