name: Actualizar precios

on:
  schedule:
    # 22:30 UTC = 5:30 p. m. hora Colombia, de lunes a viernes
    - cron: "30 22 * * 1-5"
    # Segundo intento a las 12:30 UTC (7:30 a. m.) por si la Federacion publico tarde
    - cron: "30 12 * * 1-6"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: actualizar-precios
  cancel-in-progress: false

jobs:
  precios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pruebas de los lectores de precios
        run: python -m unittest discover -s tests -v

      - name: Cafe Colombia (PDF de la Federacion)
        id: cafe_colombia
        continue-on-error: true
        run: python scripts/cafe_colombia.py

      - name: Cacao y cafe Peru (Bolsa de Nueva York)
        id: bolsa
        continue-on-error: true
        run: python scripts/bolsa.py

      - name: Guardar cambios
        run: |
          git config user.name "precio-agro-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos"
          else
            git commit -m "Precios $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi

      - name: Avisar si alguna fuente fallo
        if: steps.cafe_colombia.outcome == 'failure' || steps.bolsa.outcome == 'failure'
        run: |
          echo "Cafe Colombia: ${{ steps.cafe_colombia.outcome }} | Bolsa: ${{ steps.bolsa.outcome }}"
          exit 1
