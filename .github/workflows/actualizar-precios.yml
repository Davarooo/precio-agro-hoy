name: Actualizar precios

on:
  schedule:
    # GitHub retrasa o salta los horarios en punto: se usan minutos raros y varios intentos.
    # Hora Colombia = UTC - 5.
    - cron: "17 12 * * 1-6"   # 7:17 a. m. lunes a sabado
    - cron: "47 15 * * 1-5"   # 10:47 a. m.
    - cron: "17 19 * * 1-5"   # 2:17 p. m. (despues del cierre de Nueva York)
    - cron: "47 22 * * 1-5"   # 5:47 p. m.
    - cron: "17 2 * * 2-6"    # 9:17 p. m. de lunes a viernes (respaldo)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: actualizar-precios
  cancel-in-progress: false

jobs:
  precios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pruebas de los lectores de precios
        run: python -m unittest discover -s tests -v

      - name: Cafe Colombia (PDF de la Federacion)
        id: cafe_colombia
        continue-on-error: true
        run: python scripts/cafe_colombia.py

      - name: Cacao y cafe Peru (Bolsa de Nueva York)
        id: bolsa
        continue-on-error: true
        run: python scripts/bolsa.py

      - name: Guardar cambios
        run: |
          git config user.name "precio-agro-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos"
          else
            git commit -m "Precios $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi

      - name: Avisar si alguna fuente fallo
        if: steps.cafe_colombia.outcome == 'failure' || steps.bolsa.outcome == 'failure'
        run: |
          echo "Cafe Colombia: ${{ steps.cafe_colombia.outcome }} | Bolsa: ${{ steps.bolsa.outcome }}"
          exit 1
